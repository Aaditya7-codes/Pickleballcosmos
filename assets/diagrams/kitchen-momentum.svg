<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Pickleball kitchen momentum fault</title><desc id="desc">A court diagram showing a player volleying outside the non-volley zone then entering it due to momentum, which is a fault.</desc><rect width="1200" height="630" fill="#08131d"/><rect x="100" y="100" width="1000" height="420" rx="16" fill="#0c1824" stroke="#2a3b48" stroke-width="3"/><path d="M100 310h1000" stroke="#cfff36" stroke-width="8"/><rect x="100" y="310" width="1000" height="115" fill="#253340" opacity=".92"/><path d="M100 425h1000" stroke="#e8eff1" stroke-width="3"/><text x="125" y="390" fill="#e8eff1" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2">NON-VOLLEY ZONE</text><circle cx="695" cy="180" r="30" fill="#f3f5f1"/><path d="M695 212v78M695 243l-42 55M695 243l42 55M695 290l-34 57M695 290l34 57" stroke="#f3f5f1" stroke-width="15" stroke-linecap="round"/><text x="760" y="196" fill="#f3f5f1" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Legal volley position</text><path d="M710 360c45 42 85 54 132 56" fill="none" stroke="#cfff36" stroke-width="9" stroke-linecap="round"/><path d="M842 416l-30-24m30 24-35 16" fill="none" stroke="#cfff36" stroke-width="9" stroke-linecap="round"/><circle cx="855" cy="446" r="25" fill="#f56f5e"/><text x="898" y="455" fill="#f56f5e" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">FAULT</text><text x="100" y="66" fill="#cfff36" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="3">THE MOMENTUM TEST</text><text x="100" y="575" fill="#aebbc3" font-family="Arial,Helvetica,sans-serif" font-size="25">Entering later to play a bounced ball is a different situation.</text></svg>
