<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Why pickleball doubles starts at 0-0-2</title><desc id="desc">Three labels explain the serving score, receiving score and second-server designation in the opening call.</desc><rect width="1200" height="630" fill="#08131d"/><text x="90" y="100" fill="#cfff36" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="3">TRADITIONAL DOUBLES · OPENING CALL</text><text x="90" y="255" fill="#f3f5f1" font-family="Georgia,serif" font-size="190" font-weight="700">0–0–2</text><path d="M145 300v72M423 300v72M702 300v72" stroke="#cfff36" stroke-width="5"/><rect x="90" y="400" width="300" height="140" rx="16" fill="#0c1824" stroke="#2a3b48" stroke-width="2"/><rect x="450" y="400" width="300" height="140" rx="16" fill="#0c1824" stroke="#2a3b48" stroke-width="2"/><rect x="810" y="400" width="300" height="140" rx="16" fill="#0c1824" stroke="#2a3b48" stroke-width="2"/><text x="120" y="445" fill="#cfff36" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="2">FIRST 0</text><text x="120" y="490" fill="#f3f5f1" font-family="Georgia,serif" font-size="31" font-weight="700">Serving team score</text><text x="480" y="445" fill="#cfff36" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="2">SECOND 0</text><text x="480" y="490" fill="#f3f5f1" font-family="Georgia,serif" font-size="31" font-weight="700">Receiving team score</text><text x="840" y="445" fill="#cfff36" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="2">THE 2</text><text x="840" y="482" fill="#f3f5f1" font-family="Georgia,serif" font-size="31" font-weight="700">Opening server</text><text x="840" y="518" fill="#aebbc3" font-family="Arial,Helvetica,sans-serif" font-size="21">has one service turn</text></svg>
