<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Pickleball two-bounce sequence</title><desc id="desc">A court diagram showing the serve bouncing on the receiver's side, the return bouncing on the server's side, then open play.</desc><rect width="1200" height="640" fill="#08131d"/><rect x="90" y="90" width="1020" height="460" rx="16" fill="#0c1824" stroke="#2a3b48" stroke-width="3"/><path d="M600 90v460M90 320h1020M445 90v460M755 90v460" fill="none" stroke="#d4e0e5" stroke-width="4"/><path d="M90 230h1020M90 410h1020" stroke="#7d919d" stroke-width="3" stroke-dasharray="8 10"/><rect x="585" y="90" width="30" height="460" fill="#cfff36" opacity=".92"/><text x="98" y="58" fill="#cfff36" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="3">THE FIRST THREE SHOTS</text><text x="144" y="146" fill="#f2f5f1" font-family="Georgia,serif" font-size="38" font-weight="700">Serving team</text><text x="805" y="146" fill="#f2f5f1" font-family="Georgia,serif" font-size="38" font-weight="700">Receiving team</text><circle cx="850" cy="238" r="19" fill="#cfff36"/><text x="880" y="248" fill="#f2f5f1" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">1. Serve must bounce</text><circle cx="345" cy="404" r="19" fill="#cfff36"/><text x="126" y="457" fill="#f2f5f1" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">2. Return must bounce</text><path d="M350 285C515 190 690 190 850 285" fill="none" stroke="#cfff36" stroke-width="7" stroke-linecap="round"/><path d="M850 365C690 470 515 470 350 365" fill="none" stroke="#cfff36" stroke-width="7" stroke-linecap="round"/><text x="600" y="607" text-anchor="middle" fill="#aebbc3" font-family="Arial,Helvetica,sans-serif" font-size="26">After those two required bounces, either team may volley when otherwise legal.</text></svg>
